name: Publish Biorouter BRXT

on:
  push:
    tags: ["folklore-biorouter-v*"]

permissions:
  contents: write

jobs:
  publish:
    name: Build, verify and publish the immutable BRXT
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the public adapter
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Verify tag and manifest version agree
        shell: bash
        run: |
          set -euo pipefail
          declared_version=$(python3 -c "import json; print(json.load(open('integrations/biorouter/manifest.json'))['version'])")
          test "${GITHUB_REF_NAME}" = "folklore-biorouter-v${declared_version}"

      - name: Build and verify the locked install
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install uv==0.12.6
          integrations/biorouter/scripts/build_brxt.sh
          integrations/biorouter/scripts/verify_brxt_install.sh

      - name: Publish the release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          bundle="integrations/biorouter/dist/folklore-clinical-variant-interpretation-mcp.brxt"
          checksum="${bundle}.sha256"
          gh release create "${GITHUB_REF_NAME}" \
            "${bundle}#folklore-clinical-variant-interpretation-mcp.brxt" \
            "${checksum}#folklore-clinical-variant-interpretation-mcp.brxt.sha256" \
            --verify-tag \
            --title "Folklore Clinical Variant Interpretation MCP Biorouter extension 1.3.3" \
            --notes "Biorouter BRXT extension published by Helena Bioinformatics. The extension is a read-only bridge for public variant-level evidence and literature. It accepts no patient, phenotype, family, segregation or private case data. Results require qualified professional review and are not a diagnosis or treatment recommendation."
