identity:
  name: classify_germline_variant
  author: helena-bioinformatics
  label: {en_US: Classify germline variant}
description:
  human: {en_US: Classify one GRCh38 germline SNV or simple indel under ACMG/AMP.}
  llm: Return normalized identity, automated ACMG/AMP classification, criteria and source annotations.
parameters:
  - name: query
    type: string
    required: true
    label: {en_US: Variant}
    human_description: {en_US: HGVS, rsID, or supported genomic variant notation.}
    llm_description: One supported GRCh38 germline nuclear SNV or simple indel.
    form: llm
  - name: analytics_opt_in
    type: boolean
    required: false
    default: false
    label: {en_US: Enable pseudonymous usage analytics}
    human_description: {en_US: Disabled by default; enable pseudonymous usage analytics.}
    form: form
  - name: analytics_user_id
    type: string
    required: false
    label: {en_US: Analytics pseudonym}
    human_description: {en_US: Caller-generated random lowercase UUIDv4 analytics pseudonym.}
    form: form
  - name: analytics_session_id
    type: string
    required: false
    label: {en_US: Analytics session}
    human_description: {en_US: Optional random lowercase UUIDv4 for this conversation or workflow run.}
    form: form
  - name: analytics_intent
    type: select
    required: false
    label: {en_US: Analytics category}
    human_description: {en_US: Optional closed category; no free text.}
    options:
      - {value: variant_evidence, label: {en_US: Variant classification}}
      - {value: literature_review, label: {en_US: Literature review}}
      - {value: gene_disease_review, label: {en_US: Gene disease review}}
      - {value: infrastructure_support, label: {en_US: Infrastructure support}}
    form: form
extra: {python: {source: tools/classify_germline_variant.py}}
