identity:
  name: search_literature_corpus
  author: helena-bioinformatics
  label: {en_US: Search biomedical literature corpus}
description:
  human: {en_US: Semantic search over Folklore's public PubMed-derived corpus.}
  llm: Search public biomedical literature by natural-language question or exact identifier. Results are discovery signals for professional review.
parameters:
  - name: query
    type: string
    required: true
    label: {en_US: Query}
    human_description: {en_US: Biomedical question or identifier.}
    llm_description: Biomedical research question or PMID, DOI, PMCID, gene, variant, or phenotype identifier.
    form: llm
  - name: limit
    type: number
    required: false
    default: 10
    label: {en_US: Limit}
    human_description: {en_US: Maximum results.}
    llm_description: Maximum results to return.
    form: llm
  - name: analytics_opt_in
    type: boolean
    required: false
    default: false
    label: {en_US: Enable pseudonymous usage analytics}
    human_description: {en_US: Explicit opt-in. Leave off to remain anonymous.}
    form: form
  - name: analytics_user_id
    type: string
    required: false
    label: {en_US: Analytics pseudonym}
    human_description: {en_US: Caller-owned random lowercase UUIDv4. Never use an account or clinical identifier.}
    form: form
  - name: analytics_session_id
    type: string
    required: false
    label: {en_US: Analytics session}
    human_description: {en_US: Optional random lowercase UUIDv4 for this conversation or workflow run.}
    form: form
  - name: analytics_intent
    type: select
    required: false
    label: {en_US: Analytics category}
    human_description: {en_US: Optional closed category; no free text.}
    options:
      - {value: variant_evidence, label: {en_US: Variant evidence}}
      - {value: literature_review, label: {en_US: Literature review}}
      - {value: gene_disease_review, label: {en_US: Gene disease review}}
      - {value: infrastructure_support, label: {en_US: Infrastructure support}}
    form: form
extra: {python: {source: tools/search_literature_corpus.py}}
