identity:
  name: search_variant_literature
  author: helena-bioinformatics
  label: {en_US: Search variant literature}
description:
  human: {en_US: Find publications connected to one germline variant.}
  llm: Search public literature for one supported GRCh38 germline variant and return bounded discovery results.
parameters:
  - name: query
    type: string
    required: true
    label: {en_US: Variant}
    human_description: {en_US: HGVS, rsID, or supported genomic variant notation.}
    llm_description: One supported GRCh38 germline variant.
    form: llm
  - name: limit
    type: number
    required: false
    default: 10
    label: {en_US: Limit}
    human_description: {en_US: Maximum publications.}
    llm_description: Maximum publications to return.
    form: llm
  - name: analytics_opt_in
    type: boolean
    required: false
    default: false
    label: {en_US: Enable pseudonymous usage analytics}
    human_description: {en_US: Explicit opt-in. Leave off to remain anonymous.}
    form: form
  - name: analytics_user_id
    type: string
    required: false
    label: {en_US: Analytics pseudonym}
    human_description: {en_US: Caller-owned random lowercase UUIDv4. Never use an account or clinical identifier.}
    form: form
  - name: analytics_session_id
    type: string
    required: false
    label: {en_US: Analytics session}
    human_description: {en_US: Optional random lowercase UUIDv4 for this conversation or workflow run.}
    form: form
  - name: analytics_intent
    type: select
    required: false
    label: {en_US: Analytics category}
    human_description: {en_US: Optional closed category; no free text.}
    options:
      - {value: variant_evidence, label: {en_US: Variant evidence}}
      - {value: literature_review, label: {en_US: Literature review}}
      - {value: gene_disease_review, label: {en_US: Gene disease review}}
      - {value: infrastructure_support, label: {en_US: Infrastructure support}}
    form: form
extra: {python: {source: tools/search_variant_literature.py}}
